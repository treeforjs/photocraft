# Pushes to `release` build Windows/Linux packages and create a signed draft release.
# Ed25519 signing keys are required; Windows Authenticode certificates are optional.
# See docs/releasing.md.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run mid-upload; a newer push waits its turn.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
  INPUT_VERSION: ${{ inputs.version }}
  # craft-fonts (https://github.com/storytold/craft-fonts): shared font assets every release
  # embeds (today the Japanese fonts). An optional build input for everyone else; see
  # docs/development.md › Fonts. Bump deliberately; each build checks out this commit.
  CRAFT_FONTS_REF: abb83316d96aa59c1cf64784289e378fe9fa5695

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate update signing keys
        if: github.ref == 'refs/heads/release'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          CRAFT_UPDATE_PUBLIC_KEY: ${{ vars.CRAFT_UPDATE_PUBLIC_KEY }}
        run: bash packaging/check-update-key.sh
      - id: v
        name: Resolve version
        run: |
          . packaging/env.sh
          v="${INPUT_VERSION#v}"
          v="${v:-$VERSION}"
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$v"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "prerelease=$pre"
          } >>"$GITHUB_OUTPUT"
          echo "### PhotoCraft v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: x86, target: i686-pc-windows-msvc }
          # Windows on ARM: cross-compiled on the x64 runner, so signing and WiX run as above.
          # .github/workflows/windows-arm64.yml installs and runs it on ARM64 hardware.
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    env:
      PHOTOCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PHOTOCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      # The in-app updater's public key (docs/releasing.md › In-app updates); without it the
      # build offers the release page instead of installing updates itself.
      CRAFT_UPDATE_PUBLIC_KEY: ${{ vars.CRAFT_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out craft-fonts (embedded fonts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        shell: bash
        run: cargo xtask version set "$PHOTOCRAFT_VERSION"
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Build, sign, package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    # The oldest GitHub-hosted image, so the binaries only need glibc >= 2.35 (Ubuntu 22.04+,
    # Debian 12+, Fedora 36+, RHEL 10). See docs/releasing.md.
    runs-on: ${{ matrix.runner }}
    # No `environment: release`: this job reads no secrets, so a branch dry run can run it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    env:
      PHOTOCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PHOTOCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NFPM_VERSION: 2.47.0
      # The in-app updater's public key (docs/releasing.md › In-app updates); without it the
      # build offers the release page instead of installing updates itself.
      CRAFT_UPDATE_PUBLIC_KEY: ${{ vars.CRAFT_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out craft-fonts (embedded fonts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            desktop-file-utils appstream python3-yaml zsync
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${{ matrix.deb }}.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$PHOTOCRAFT_VERSION"
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh
      - name: Check the packages
        run: |
          dpkg-deb --info dist/release/*.deb
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/photocraft$|metainfo|applications'
          ldd target/release/photocraft
          python3 -c "import yaml; m = yaml.safe_load(open('packaging/linux/flatpak/ai.storyteller.photocraft.yml')); assert m['id'] == 'ai.storyteller.photocraft'"
          for appimage in dist/release/*.AppImage; do
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
            # Update information (#349) is embedded, and the .zsync for delta updates sits beside it.
            "$appimage" --appimage-updateinformation | grep -F 'gh-releases-zsync|'
            test -s "$appimage.zsync"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  ubuntu:
    name: Ubuntu ${{ matrix.ubuntu }} installed desktop (x86_64)
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    steps:
      - name: Install display and validation tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git jq dbus-x11 xvfb xauth \
            mesa-vulkan-drivers libegl-mesa0 desktop-file-utils shared-mime-info
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/linux
      - name: Install the released Debian package
        run: |
          apt-get install -y --no-install-recommends ./dist/linux/*.deb
          desktop-file-validate /usr/share/applications/ai.storyteller.photocraft.desktop
          test -r /usr/share/icons/hicolor/256x256/apps/ai.storyteller.photocraft.png
          photocraft --version
          photocraft-cli --version
      - name: Render and save as an ordinary desktop user
        run: |
          useradd --create-home photocraft-smoke
          runuser -u photocraft-smoke -- env LIBGL_ALWAYS_SOFTWARE=1 \
            PHOTOCRAFT_SMOKE_ARTIFACTS=/tmp/photocraft-smoke-artifacts/auto \
            xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- \
            bash packaging/linux/smoke-test.sh /usr/bin/photocraft /usr/bin/photocraft-cli
      - name: Check the OpenGL fallback
        run: |
          runuser -u photocraft-smoke -- env LIBGL_ALWAYS_SOFTWARE=1 WGPU_BACKEND=gl \
            PHOTOCRAFT_SMOKE_ARTIFACTS=/tmp/photocraft-smoke-artifacts/gl \
            xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- \
            bash packaging/linux/smoke-test.sh /usr/bin/photocraft /usr/bin/photocraft-cli
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-${{ matrix.ubuntu }}-smoke
          path: /tmp/photocraft-smoke-artifacts/
          if-no-files-found: warn

  release:
    name: Draft GitHub Release
    if: github.ref == 'refs/heads/release'
    needs: [version, windows, linux, ubuntu]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Check required packages and write checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          expected=()
          for arch in x64 x86 arm64; do
            expected+=("photocraft-$VERSION-windows-$arch.msi")
            expected+=("photocraft-$VERSION-windows-$arch-portable.zip")
          done
          for arch in x86_64 aarch64; do
            for format in AppImage AppImage.zsync deb rpm tar.gz; do
              expected+=("photocraft-$VERSION-linux-$arch.$format")
            done
          done
          for asset in "${expected[@]}"; do
            if [ ! -f "$asset" ] || [ ! -s "$asset" ]; then
              echo "::error::Missing or empty release package: $asset"
              exit 1
            fi
          done
          shopt -s nullglob dotglob
          for asset in *; do
            if ! printf '%s\n' "${expected[@]}" | grep -Fxq -- "$asset"; then
              echo "::error::Unexpected release payload: $asset"
              exit 1
            fi
          done
          sha256sum -- "${expected[@]}" >SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
      # The in-app updater installs only what this signature vouches for (docs/releasing.md ›
      # In-app updates). The .sig is written after the list, so the list doesn't name it.
      - uses: actions/checkout@v4
        with:
          path: release-source
      - name: Sign the checksums
        working-directory: artifacts
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          CRAFT_UPDATE_PUBLIC_KEY: ${{ vars.CRAFT_UPDATE_PUBLIC_KEY }}
        run: |
          if grep -q 'SHA256SUMS' SHA256SUMS.txt; then
            echo "::error::SHA256SUMS.txt lists itself or its signature"
            exit 1
          fi
          bash "$GITHUB_WORKSPACE/release-source/packaging/check-update-key.sh" SHA256SUMS.txt
      - name: Create or update the draft release
        working-directory: artifacts
        run: |
          tag="v$VERSION"
          title="PhotoCraft v$VERSION"
          cat >"$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Windows and Linux packages for PhotoCraft.

          Windows: use the MSI installer, the portable ZIP, or Craftworks.
          Linux: use the AppImage, Debian/RPM package, tarball, or Craftworks.
          Craftworks verifies downloads using SHA256SUMS.txt and its Ed25519 signature.
          NOTES
          pre=()
          if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $tag is already published. Bump the version (cargo xtask version set) before pushing to release."
              exit 1
            fi
            echo "Updating draft $tag: replacing its assets"
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE"
            gh release upload "$tag" --clobber -- *
          else
            echo "Creating draft $tag"
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/release-notes.md" "${pre[@]}" -- *
          fi
          {
            echo "Draft release **$title** at \`${GITHUB_SHA::9}\`:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
